<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Productos — Ferretería FerreAmigo</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <img class="site-header__logo" src="assets/logo.svg" alt="Logo">
    <div class="site-header__brand">
      <strong>Ferretería FerreAmigo</strong>
      <span>Catálogo de productos</span>
    </div>
    <div class="site-header__spacer"></div>
    <div class="site-header__actions">
      <button class="btn-back" id="backBtn" data-fallback="modulos.html">← Volver</button>
      <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="main-content">
  <div class="breadcrumb"><a href="modulos.html">Módulos</a> / Catálogo de Productos</div>
  <div class="page-title-row">
    <span class="icon-badge">📦</span>
    <h1>Catálogo de Productos</h1>
  </div>

  <div class="search-bar">
    <span class="search-icon">🔎</span>
    <input type="text" id="globalSearch" placeholder="Buscar un producto en todo el catálogo...">
  </div>

  <div id="searchResultsPanel"></div>

  <div class="toolbar" id="categoriesToolbar">
    <h2 style="margin:0;font-size:1.05rem;color:var(--color-text-muted);">Categorías</h2>
    <button class="btn btn-primary" id="addCategoryBtn">+ Agregar categoría</button>
  </div>

  <div class="category-grid" id="categoryGrid"></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
