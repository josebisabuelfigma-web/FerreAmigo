<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Ferretería FerreAmigo</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="assets/logo.svg" alt="Logo Ferretería FerreAmigo">
    <h1>Ferretería FerreAmigo</h1>
    <p class="subtitle">Sistema de administración interno</p>

    <div class="login-error" id="loginError">Usuario o contraseña incorrectos.</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Ingresa tu usuario" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

    <p class="login-hint">Acceso restringido al personal autorizado de Ferretería FerreAmigo.</p>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
